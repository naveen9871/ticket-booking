# =============================================
# Nginx Host Config for arosai.in
# Location: /etc/nginx/sites-available/arosai.in
# =============================================
# This is the BEFORE-SSL config used when first obtaining
# the Let's Encrypt certificate. After certbot runs, it will
# automatically update this file to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name arosai.in www.arosai.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment after cert is obtained)
    # return 301 https://$host$request_uri;

    # ---- Temporary HTTP routes (before SSL) ----
    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

