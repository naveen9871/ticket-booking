apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketly-backend
  namespace: ticketly
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ticketly-backend
  template:
    metadata:
      labels:
        app: ticketly-backend
    spec:
      containers:
        - name: backend
          image: ticketly/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketly-config
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ticketly-backend
  namespace: ticketly
spec:
  selector:
    app: ticketly-backend
  ports:
    - port: 8000
      targetPort: 8000

